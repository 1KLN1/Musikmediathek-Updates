name: Release KLN Performance 10 (Python Pre-release)

on:
  push:
    paths:
      - 'release-sources/musikmediathek_v1.9.31_test15_performance10.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kln-release-v1.9.31-test15-performance10
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check source syntax and create verified package
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="release-sources/musikmediathek_v1.9.31_test15_performance10.py"
          python -m py_compile "$SOURCE"
          mkdir -p dist
          python - <<'PY'
          import hashlib, pathlib, zipfile
          source = pathlib.Path("release-sources/musikmediathek_v1.9.31_test15_performance10.py")
          assert source.is_file() and source.stat().st_size > 500000
          output = pathlib.Path("dist/KLN_Test15_Performance10.zip")
          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              archive.write(source, arcname=source.name)
          with zipfile.ZipFile(output, "r") as archive:
              assert archive.testzip() is None
              assert archive.namelist() == [source.name]
              assert archive.read(source.name) == source.read_bytes()
          with pathlib.Path("dist/SHA256SUMS.txt").open("w", encoding="utf-8") as sums:
              for file in (output, source):
                  digest = hashlib.sha256(file.read_bytes()).hexdigest()
                  print(f"{digest}  {file.name}", file=sums)
          PY

      - name: Publish Python pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.9.31-test15-performance10"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; refusing silent overwrite."
            exit 1
          fi
          cat > dist/RELEASE_NOTES.md <<'NOTES'
          # Meine Musikmediathek 1.9.31 – Test 15 Performance 10

          **Vorabversion zum Testen (Python-Quellcode), kein Windows-EXE-Installer und kein stabiles automatisches Update.**

          - Die Mixer-Übersicht öffnet separate vollständige Seiten für Equalizer, Tempo und Tonhöhe.
          - Eine gemeinsame Wiedergabeleiste, A/B-Schleife und WAV-Export bleiben erreichbar.
          - Die in Performance 9 entwickelte, geglättete Steuerung und Neon-Waveform bleiben erhalten.
          - Jede Testversion nutzt eine eigene Testdatenbank.

          **Tests:** Python-Syntax und ZIP-Integrität in GitHub Actions. Linux-GUI-Tests während der Entwicklung. Windows-Audio, Export und Installer nicht abschließend verifiziert.

          **Start:** ZIP entpacken, Python 3.13 und die im Script genannten Abhängigkeiten installieren und das Python-Skript starten. Bestehende stabile Version v1.9.30 nicht überschreiben.
          NOTES
          gh release create "$TAG" \
            "dist/KLN_Test15_Performance10.zip" \
            "dist/SHA256SUMS.txt" \
            --title "Meine Musikmediathek – Test 15 Performance 10" \
            --notes-file dist/RELEASE_NOTES.md \
            --prerelease \
            --target "$GITHUB_SHA"
