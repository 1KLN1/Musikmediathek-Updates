name: Build and release Meine Musikmediathek v1.9.31 (Windows EXE)

on:
  push:
    paths:
      - '.github/workflows/windows-release-v1.9.31.yml'
      - 'release-sources/musikmediathek_v1.9.31_test15_performance10.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kln-v1.9.31-windows-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: '.github/workflows/windows-release-v1.9.31.yml'

      - name: Install runtime dependencies and PyInstaller
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.16,<7" mutagen pygame pillow send2trash numpy sounddevice soundfile scipy imageio-ffmpeg

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile release-sources/musikmediathek_v1.9.31_test15_performance10.py

      - name: Build Windows executable (one-folder)
        shell: bash
        run: |
          set -euo pipefail
          python -m PyInstaller \
            --noconfirm --clean --windowed --onedir \
            --name "Meine_Musikmediathek" \
            --collect-all imageio_ffmpeg \
            --collect-binaries soundfile \
            --collect-binaries sounddevice \
            --collect-submodules mutagen \
            --hidden-import PIL.ImageTk \
            --hidden-import scipy.signal \
            --hidden-import scipy.io.wavfile \
            --hidden-import soundfile \
            --hidden-import sounddevice \
            --hidden-import pygame \
            release-sources/musikmediathek_v1.9.31_test15_performance10.py

      - name: Check package structure and write checksums
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, pathlib, zipfile
          directory = pathlib.Path("dist/Meine_Musikmediathek")
          executable = directory / "Meine_Musikmediathek.exe"
          internal = directory / "_internal"
          assert executable.is_file() and executable.stat().st_size > 100000, "Windows EXE missing"
          assert internal.is_dir(), "PyInstaller _internal directory missing"
          files = [f for f in directory.rglob("*") if f.is_file()]
          assert len(files) > 20, "Incomplete PyInstaller output"
          output = pathlib.Path("dist/Meine_Musikmediathek_v1.9.31_Windows.zip")
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for file in files:
                  archive.write(file, arcname=file.relative_to(directory.parent).as_posix())
          with zipfile.ZipFile(output, "r") as archive:
              assert archive.testzip() is None, "ZIP CRC validation failed"
              names = set(archive.namelist())
              assert "Meine_Musikmediathek/Meine_Musikmediathek.exe" in names
              assert any(name.startswith("Meine_Musikmediathek/_internal/") for name in names)
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          pathlib.Path("dist/SHA256SUMS.txt").write_text(f"{digest}  {output.name}\n", encoding="ascii")
          print(f"Validated {len(files)} packaged files, archive {output.stat().st_size} bytes")
          PY

      - name: Publish v1.9.31 Windows release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.9.31"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $TAG."
            exit 1
          fi
          cat > dist/RELEASE_NOTES.md <<'NOTES'
          # Meine Musikmediathek v1.9.31 – Windows

          Die Windows-Version basiert auf dem Entwicklungsstand **Test 15 Performance 10**.

          - Neues **Mixer**-Konzept mit eigenen vollständigen Ansichten für Equalizer, Tempo und Tonhöhe.
          - Detailliertere BPM-, Pitch- und Equalizer-Bedienung.
          - A/B-Schleife und Audio-Export bleiben erreichbar.
          - Geglättete Player-Schaltflächen und verfeinerte Neon-Waveform.
          - Überarbeitete Player-Layoutberechnung.

          **Windows-Paket:** ZIP vollständig entpacken und `Meine_Musikmediathek.exe` im Ordner `Meine_Musikmediathek` starten. Den Ordner `_internal` nicht entfernen.

          **Build-Status:** GitHub Actions erstellt und prüft EXE, _internal-Dateien, ZIP und SHA-256. Ein manueller Test von Soundausgabe, Export und Updateinstallation auf einem Windows-PC ist weiterhin empfohlen.

          **Hinweis zu Daten:** Der App-Quellstand verwendet weiterhin die separate Datenbank des Teststands Performance 10; persönliche Musikdateien werden durch den Build nicht verändert.
          NOTES
          gh release create "$TAG" \
            "dist/Meine_Musikmediathek_v1.9.31_Windows.zip" \
            "dist/SHA256SUMS.txt" \
            --title "Meine Musikmediathek v1.9.31 – Windows" \
            --notes-file "dist/RELEASE_NOTES.md" \
            --target "$GITHUB_SHA" \
            --latest
